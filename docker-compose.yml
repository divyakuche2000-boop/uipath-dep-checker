version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uipath-dep-checker-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Ephemeral upload/extract scratch space — not persisted
      - uploads_scratch:/app/uploads
      - extracted_scratch:/app/extracted
    networks:
      - internal
    # Only reachable internally — NOT exposed to host
    expose:
      - "5000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uipath-dep-checker-frontend
    restart: unless-stopped
    ports:
      # Bind only to localhost — never 0.0.0.0
      - "127.0.0.1:3000:8080"
    depends_on:
      - backend
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge
    internal: false

volumes:
  uploads_scratch:
  extracted_scratch:
